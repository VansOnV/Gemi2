const COLORS = [
  "#ff0040", "#00ffea", "#ffee00", "#ff00e6",
  "#00ff44", "#3300ff", "#ff8800", "#ffffff"
];

let running = false;
let vw = window.innerWidth;
let vh = window.innerHeight;

window.addEventListener("resize", () => {
  vw = window.innerWidth;
  vh = window.innerHeight;
});

function playSound() {
  const a = new Audio(AUDIO_SRC);
  a.volume = 1.0;
  a.play().catch(() => {});
}

function spawnSquare() {
  const sq = document.createElement("div");
  sq.className = "sq";
  const size = 30 + Math.random() * Math.min(220, vw * 0.6);
  sq.style.width = size + "px";
  sq.style.height = size + "px";
  sq.style.left = Math.random() * Math.max(0, vw - size) + "px";
  sq.style.top = Math.random() * Math.max(0, vh - size) + "px";
  sq.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
  sq.style.opacity = "0.5";
  document.body.appendChild(sq);

  let flickers = 3 + Math.floor(Math.random() * 5);
  let visible = true;
  const flickerInterval = setInterval(() => {
    visible = !visible;
    sq.style.opacity = visible ? "0.5" : "0";
    flickers--;
    if (flickers <= 0) {
      clearInterval(flickerInterval);
      sq.remove();
    }
  }, 60 + Math.random() * 90);
}

function loop() {
  if (!running) return;
  spawnSquare();
  if (Math.random() < 0.4) spawnSquare();
  setTimeout(loop, 40 + Math.random() * 80);
}

function soundLoop() {
  if (!running) return;
  playSound();
  setTimeout(soundLoop, 300 + Math.random() * 500);
}

function start() {
  if (running) return;
  running = true;
  loop();
  soundLoop();
}

// Try to autoplay immediately.
window.addEventListener("load", start);

// Fallback: some mobile browsers block audio until a user gesture.
// If that happens, sound simply begins on the very first touch/click
// anywhere on the page (visuals are already running regardless).
["click", "touchstart", "keydown"].forEach(evt => {
  window.addEventListener(evt, start, { once: true, passive: true });
});
</script>
</body>
</html>
