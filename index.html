const statusEl = document.getElementById("status");
function setStatus(text, fade) {
  statusEl.textContent = text;
  if (fade) {
    setTimeout(() => { statusEl.style.opacity = "0"; }, 1200);
  } else {
    statusEl.style.opacity = "1";
  }
}

});

let audioBuffer = null;

function base64ToArrayBuffer(b64str) {
  const binary = atob(b64str);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

async function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();
  const raw = base64ToArrayBuffer("");
  return raw;
}

function playSoundWebAudio() {
  if (!audioCtx || !audioBuffer) return false;
  try {
    const src = audioCtx.createBufferSource();
    src.buffer = audioBuffer;
    const gain = audioCtx.createGain();
    gain.gain.value = 1.0;
    src.connect(gain).connect(audioCtx.destination);
    src.start(0);
    return true;
  } catch (e) {
    return false;
  }
}

function playSoundFallback() {
  const a = new Audio(AUDIO_SRC);
  a.volume = 1.0;
  a.play().catch(() => {});
}

function playSound() {
  if (audioUnlocked && audioCtx && audioBuffer) {
    playSoundWebAudio();
  } else {
    playSoundFallback();
  }
}

function spawnSquare() {
  const sq = document.createElement("div");
  sq.className = "sq";
  const size = 30 + Math.random() * Math.min(220, vw * 0.6);
  sq.style.width = size + "px";
  sq.style.height = size + "px";
  sq.style.left = Math.random() * Math.max(0, vw - size) + "px";
  sq.style.top = Math.random() * Math.max(0, vh - size) + "px";
  sq.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
  sq.style.opacity = "0.5";
  document.body.appendChild(sq);

  let flickers = 3 + Math.floor(Math.random() * 5);
  let visible = true;
  const flickerInterval = setInterval(() => {
    visible = !visible;
    sq.style.opacity = visible ? "0.5" : "0";
    flickers--;
    if (flickers <= 0) {
      clearInterval(flickerInterval);
      sq.remove();
    }
  }, 60 + Math.random() * 90);
}

function visualLoop() {
  if (!running) return;
  spawnSquare();
  if (Math.random() < 0.4) spawnSquare();
  setTimeout(visualLoop, 40 + Math.random() * 80);
}

function soundLoop() {
  if (!running) return;
  playSound();
  setTimeout(soundLoop, 300 + Math.random() * 500);
}

function startVisuals() {
  if (running) return;
  running = true;
  visualLoop();
  soundLoop();
}

async function setupAudioContext() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    const binary = atob(AUDIO_SRC.split(",")[1]);
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
    audioBuffer = await audioCtx.decodeAudioData(bytes.buffer);
    if (audioCtx.state === "suspended") {
      await audioCtx.resume();
    }
    if (audioCtx.state === "running") {
      audioUnlocked = true;
      setStatus("audio: on", true);
    } else {
      setStatus("audio: tap anywhere to enable sound");
    }
  } catch (e) {
    setStatus("audio: tap anywhere to enable sound");
  }
}

async function tryUnlockOnGesture() {
  if (!audioCtx) return;
  try {
    if (audioCtx.state === "suspended") {
      await audioCtx.resume();
    }
    if (audioCtx.state === "running") {
      audioUnlocked = true;
      setStatus("audio: on", true);
    }
  } catch (e) {}
}

function boot() {
  startVisuals();
  setupAudioContext();
}

window.addEventListener("load", boot);

["click", "touchstart", "keydown", "pointerdown"].forEach(evt => {
  window.addEventListener(evt, () => {
    startVisuals();
    tryUnlockOnGesture();
  }, { passive: true });
});
</script>
