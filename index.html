<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flicker</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: #000;
    overflow: hidden;
    touch-action: none;
  }
  .sq {
    position: fixed;
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: screen;
  }
  #status {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 1000;
    font-family: system-ui, sans-serif;
    font-size: 13px;
    color: #fff;
    background: rgba(0,0,0,0.55);
    padding: 6px 10px;
    border-radius: 6px;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
</style>
</head>
<body>
<div id="status">audio: loading…</div>

<script>
const AUDIO_URL = "sound.mp3"; // must sit next to this index.html in the repo

const COLORS = [
  "#ff0040", "#00ffea", "#ffee00", "#ff00e6",
  "#00ff44", "#3300ff", "#ff8800", "#ffffff"
];

const statusEl = document.getElementById("status");
function setStatus(text, fade) {
  statusEl.textContent = text;
  statusEl.style.opacity = "1";
  if (fade) {
    setTimeout(() => { statusEl.style.opacity = "0"; }, 1200);
  }
}

let running = false;
let audioUnlocked = false;
let vw = window.innerWidth;
let vh = window.innerHeight;

window.addEventListener("resize", () => {
  vw = window.innerWidth;
  vh = window.innerHeight;
});

let audioCtx = null;
let audioBuffer = null;

async function loadAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    const res = await fetch(AUDIO_URL);
    if (!res.ok) throw new Error("fetch failed: " + res.status);
    const arrayBuf = await res.arrayBuffer();
    audioBuffer = await audioCtx.decodeAudioData(arrayBuf);

    if (audioCtx.state === "suspended") {
      try { await audioCtx.resume(); } catch (e) {}
    }
    if (audioCtx.state === "running") {
      audioUnlocked = true;
      setStatus("audio: on", true);
    } else {
      setStatus("audio: tap anywhere to enable sound");
    }
  } catch (e) {
    setStatus("audio error: " + e.message);
  }
}

function playSound() {
  if (!audioCtx || !audioBuffer) return;
  try {
    const src = audioCtx.createBufferSource();
    src.buffer = audioBuffer;
    const gain = audioCtx.createGain();
    gain.gain.value = 1.0;
    src.connect(gain).connect(audioCtx.destination);
    src.start(0);
  } catch (e) {}
}

async function tryUnlockOnGesture() {
  if (!audioCtx) return;
  try {
    if (audioCtx.state === "suspended") {
      await audioCtx.resume();
    }
    if (audioCtx.state === "running") {
      audioUnlocked = true;
      setStatus("audio: on", true);
    }
  } catch (e) {}
}

function spawnSquare() {
  const sq = document.createElement("div");
  sq.className = "sq";
  const size = 30 + Math.random() * Math.min(220, vw * 0.6);
  sq.style.width = size + "px";
  sq.style.height = size + "px";
  sq.style.left = Math.random() * Math.max(0, vw - size) + "px";
  sq.style.top = Math.random() * Math.max(0, vh - size) + "px";
  sq.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
  sq.style.opacity = "0.5";
  document.body.appendChild(sq);

  let flickers = 3 + Math.floor(Math.random() * 5);
  let visible = true;
  const flickerInterval = setInterval(() => {
    visible = !visible;
    sq.style.opacity = visible ? "0.5" : "0";
    flickers--;
    if (flickers <= 0) {
      clearInterval(flickerInterval);
      sq.remove();
    }
  }, 60 + Math.random() * 90);
}

function visualLoop() {
  if (!running) return;
  spawnSquare();
  if (Math.random() < 0.4) spawnSquare();
  setTimeout(visualLoop, 40 + Math.random() * 80);
}

function soundLoop() {
  if (!running) return;
  if (audioUnlocked) playSound();
  setTimeout(soundLoop, 300 + Math.random() * 500);
}

function startVisuals() {
  if (running) return;
  running = true;
  visualLoop();
  soundLoop();
}

function boot() {
  startVisuals();
  loadAudio();
}

window.addEventListener("load", boot);

["click", "touchstart", "keydown", "pointerdown"].forEach(evt => {
  window.addEventListener(evt, () => {
    startVisuals();
    tryUnlockOnGesture();
  }, { passive: true });
});
</script>
</body>
</html>
